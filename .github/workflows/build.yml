name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
        platform: [x86, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild save-queue-foobar.sln /m /restore /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /v:minimal

      - name: Upload component
        uses: actions/upload-artifact@v4
        with:
          name: foo_save_queue-${{ matrix.platform }}-${{ matrix.configuration }}
          path: build/${{ matrix.platform }}/${{ matrix.configuration }}/foo_save_queue.dll
          if-no-files-found: error
