name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag name to release (e.g. v1.0.0). Required for manual runs without a pushed tag.'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify foobar2000 SDK checkout is complete
        shell: pwsh
        run: |
          $required = @(
            'third_party/foobar2000-sdk/foobar2000/SDK/foobar2000_SDK.vcxproj'
            'third_party/foobar2000-sdk/foobar2000/helpers/foobar2000_sdk_helpers.vcxproj'
            'third_party/foobar2000-sdk/foobar2000/foobar2000_component_client/foobar2000_component_client.vcxproj'
            'third_party/foobar2000-sdk/pfc/pfc.vcxproj'
            'third_party/foobar2000-sdk/libPPUI/libPPUI.vcxproj'
            'third_party/foobar2000-sdk/foobar2000/shared/shared-Win32.lib'
            'third_party/foobar2000-sdk/foobar2000/shared/shared-x64.lib'
            'third_party/foobar2000-sdk/foobar2000/shared/shared-ARM64EC.lib'
          )
          $missing = @()
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $missing += $path
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::The foobar2000 SDK tree is incomplete in this checkout/commit. Missing files (paths are relative to the repo root):"
            foreach ($path in $missing) {
              Write-Host "::error::$path"
            }
            Write-Host "::error::The foobar2000 SDK files above must be committed to the repository. Commit them and push again."
            exit 1
          }
          Write-Host "OK: foobar2000 SDK tree is complete - all 8 required files are present."

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild save-queue-foobar.sln /m /restore /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v145 /v:minimal

      - name: Upload component
        uses: actions/upload-artifact@v4
        with:
          name: foo_save_queue-${{ matrix.platform }}
          path: build/${{ matrix.platform == 'x86' && 'Win32' || matrix.platform }}/Release/foo_save_queue.dll
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Resolve release tag and version
        id: release-info
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No release tag: push a v* tag or provide the 'version' input on workflow_dispatch."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mv "dist/foo_save_queue-x86/foo_save_queue.dll" release-assets/foo_save_queue-x86.dll
          mv "dist/foo_save_queue-x64/foo_save_queue.dll" release-assets/foo_save_queue-x64.dll
          (cd release-assets && zip "../foo_save_queue-${{ steps.release-info.outputs.version }}.zip" foo_save_queue-x86.dll foo_save_queue-x64.dll)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release-info.outputs.tag }}" \
            release-assets/foo_save_queue-x86.dll \
            release-assets/foo_save_queue-x64.dll \
            "foo_save_queue-${{ steps.release-info.outputs.version }}.zip" \
            --title "foo_save_queue ${{ steps.release-info.outputs.version }}" \
            --generate-notes \
            --target "${{ github.sha }}"
